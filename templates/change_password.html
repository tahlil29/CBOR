{% extends "base.html" %}{% block title %}Password{% endblock %}{% block heading %}Change Password{% endblock %}
{% block content %}
<section class="panel narrow centered-panel">
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="span-2">Current password<input type="password" name="old_password" required></label>
    <label class="span-2">New password<input type="password" name="new_password" minlength="10" required></label>
    <div class="span-2"><button class="btn primary">Update password</button></div>
  </form>
</section>
{% endblock %}
